<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #0a0a0d;
        color: #f4f4f5;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        width: 1600px;
        height: 1200px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .chart-frame {
        width: 1500px;
        height: 1100px;
        background: #121217;
        border: 1px solid #27272a;
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        display: flex;
        flex-direction: column;
      }
      .chart-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 20px;
        border-bottom: 1px solid #27272a;
        padding-bottom: 16px;
      }
      .chart-title {
        font-size: 32px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -0.02em;
      }
      .chart-subtitle {
        font-size: 16px;
        font-weight: 500;
        color: #a1a1aa;
        margin-top: 4px;
      }
      .chart-badge {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 6px 16px;
        font-size: 14px;
        font-weight: 600;
        color: #ff4d4d;
      }
      .chart-container {
        flex-grow: 1;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="chart-frame">
      <div class="chart-header">
        <div>
          <div class="chart-title">
            {% block title %}Chart Title{% endblock %}
          </div>
          <div class="chart-subtitle">
            {% block subtitle %}Chart Subtitle{% endblock %}
          </div>
        </div>
        <div class="chart-badge">
          {% block badge %}TUBE-MANCY DATA{% endblock %}
        </div>
      </div>
      <div id="main" class="chart-container"></div>
    </div>

    <script>
      // Load custom ECharts theme JSON
      const customTheme = {{ theme_json | safe }};
      if (customTheme && Object.keys(customTheme).length > 0) {
          echarts.registerTheme('custom_dark', customTheme);
      }

      const chartDom = document.getElementById('main');
      const myChart = echarts.init(chartDom, customTheme ? 'custom_dark' : 'dark');

      {% block chart_script %}{% endblock %}
    </script>
  </body>
</html>
