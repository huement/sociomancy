<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 580px;
        height: 220px;
        background: #0a0a0d;
        border: 1px solid #27272a;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }

      /* Banner image as a header background */
      .banner-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 75px;
        background-size: cover;
        background-position: center;
        border-bottom: 1px solid #27272a;
      }

      /* Dark gradient overlay so text remains readable */
      .banner-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(10, 10, 13, 0.2) 0%,
          rgba(10, 10, 13, 0.95) 100%
        );
      }

      .card-body {
        position: relative;
        z-index: 2;
        padding: 8px 20px 16px 20px;
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .avatar {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #3f3f46;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        flex-shrink: 0;
      }

      .content {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }

      .header {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .handle {
        font-size: 13px;
        font-weight: 500;
        color: #a1a1aa;
      }

      .stats-grid {
        display: flex;
        gap: 10px;
      }

      .stat-badge {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        padding: 6px 14px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .stat-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #71717a;
      }

      .stat-value {
        font-size: 15px;
        font-weight: 700;
        color: #f4f4f5;
      }

      .stat-value.highlight {
        color: #ff4d4d;
      }
    </style>
  </head>
  <body>
    {% for channel in channels %}
    <div class="card">
      <div
        class="banner-header"
        style="background-image: url('{{ channel.banner_url }}');"
      >
        <div class="banner-overlay"></div>
      </div>

      <div class="card-body">
        <img class="avatar" src="{{ channel.avatar_url }}" alt="Profile" />
        <div class="content">
          <div class="header">
            <div class="title">{{ channel.title }}</div>
            <div class="handle">{{ channel.handle }}</div>
          </div>
          <div class="stats-grid">
            <div class="stat-badge">
              <span class="stat-label">Subscribers</span>
              <span class="stat-value highlight">{{ channel.subs }}</span>
            </div>
            <div class="stat-badge">
              <span class="stat-label">Lifespan</span>
              <span class="stat-value">{{ channel.lifespan }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    {% endfor %}
  </body>
</html>
